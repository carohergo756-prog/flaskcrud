
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: changeme
      MYSQL_DATABASE: flaskcrud
    ports:
      - "3307:3306"
    volumes:
      - ./sql/db.sql:/docker-entrypoint-initdb.d/db.sql
      - mysql_data:/var/lib/mysql

  pythonapp:
    build: .
    depends_on:
      - mysql
    ports:
      - "8080:8080"
    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: root
      MYSQL_PASSWORD: changeme
      MYSQL_DB: flaskcrud
      MYSQL_PORT: 3306

volumes:
  mysql_data:
